<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora</title>
    <script>
      // 首屏主题预设：在 bundle 加载前写入 data-theme，避免闪白/闪黑
      // 与 stores/settings.svelte.ts 的存储键保持一致
      ;(() => {
        let saved = null;
        try {
          saved = localStorage.getItem('aurora.theme');
        } catch {}
        const valid = saved === 'dark' || saved === 'light' || saved === 'system';
        if (!valid) saved = 'system';
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const dark =
          saved === 'dark' || (saved === 'system' && prefersDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
